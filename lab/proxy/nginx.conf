# A front-end that validates the host and owns the forwarding headers.
#
# Two servers, and the difference between them is the whole scenario. The
# default one answers every host this deployment does not know, which is what
# the raw bypass shapes are aimed at. The named one proxies to the application
# and sets the forwarding headers itself rather than passing on whatever the
# client sent, which is the fix for header injection through a proxy chain.

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    server {
        listen 80 default_server;
        # An unknown host gets nothing. A bypass shape that reaches the
        # application past this is a finding; one that does not, is not.
        #
        # The refusal carries the same response-header posture as the
        # application, so that a scenario about host validation does not also
        # become a scenario about a bare error page.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; report-to csp-endpoint" always;
        add_header Reporting-Endpoints "csp-endpoint=\"/csp-reports\"" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        return 403;
    }

    server {
        listen 80;
        server_name allowed.lab;

        location / {
            proxy_pass http://app:8000;
            # Set here, never accepted from the client. The application behind
            # this proxy builds its links from X-Forwarded-Host, and this line
            # is what makes that safe.
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
        }
    }
}
