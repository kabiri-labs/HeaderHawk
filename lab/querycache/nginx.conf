# A cache whose key leaves the query string out.
#
# This is the deployment that makes a scanner blind rather than wrong: every
# cache-buster a search invents lands on the same key, so the first stored
# response answers every probe and nothing a header does can be seen. A
# scanner that reported this target clean would be reporting that it looked,
# when in fact it could not.

events {
    worker_connections 128;
}

http {
    access_log /dev/stdout;
    error_log /dev/stderr warn;
    server_tokens off;

    proxy_cache_path /tmp/nginx-cache levels=1:2 keys_zone=lab:1m
                     max_size=16m inactive=10m use_temp_path=off;

    server {
        listen 80 default_server;

        location / {
            proxy_pass http://app:8000;
            proxy_cache lab;
            # The defect: no $args. One key for every query string.
            proxy_cache_key "$scheme$proxy_host$uri";
            proxy_cache_valid 200 302 5m;
            add_header X-Cache $upstream_cache_status always;
        }
    }
}
